name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    # Public repo: pull requests from external forks run on a GitHub-hosted
    # runner, never on the org's self-hosted runner. Same job name either way,
    # so a required `validate` check is never satisfied by a skipped job.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'ci-runner' }}

    steps:
      # Third-party actions are pinned to a reviewed commit SHA: a moved tag
      # must not execute new code on the self-hosted runner.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.10.8

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.38.9
          channel: stable

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Analyze packages
        run: dart run melos run analyze

      - name: Verify formatting
        run: dart run melos exec --fail-fast -- "dart format --set-exit-if-changed ."

      - name: Run Dart and Flutter tests
        run: dart run melos run test

      - name: Validate package publish surfaces
        run: dart run melos run publish:dry-run
