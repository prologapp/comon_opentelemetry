name: comon_otel_dio
description: Dio interceptor package for comon_otel with request tracing and propagation.
version: 0.1.1
# Consumed as a git monorepo dependency (sibling `comon_otel` via path), which
# is incompatible with pub.dev publishing. Upstream (serezhia) publishes; this
# fork is git-consumed only.
publish_to: none
resolution: workspace
homepage: https://github.com/serezhia/comon_opentelemetry/tree/main/packages/comon_otel_dio
repository: https://github.com/serezhia/comon_opentelemetry
issue_tracker: https://github.com/serezhia/comon_opentelemetry/issues
documentation: https://github.com/serezhia/comon_opentelemetry/tree/main/packages/comon_otel_dio#readme
topics:
  - opentelemetry
  - dio
  - http
  - tracing
  - observability

environment:
  sdk: ^3.9.0

dependencies:
  comon_otel:
    path: ../comon_otel
  dio: ^5.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3